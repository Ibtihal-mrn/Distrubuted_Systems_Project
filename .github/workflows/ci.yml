name: CI/CD workflow

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4 # redémarre dans un dossier vide et télécharge le dépot au commit qui a déclenché
      - run: python3 -m venv .venv
      - run: .venv/bin/pip install -r requirements-dev.txt
      - run: .venv/bin/python -m pytest

  deploy-test:
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/deploy.sh test "${GITHUB_SHA::7}" 

  smoke-test:
    needs: deploy-test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/smoke-test.sh test

  deploy-prod:
    needs: smoke-test
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/deploy.sh prod "${GITHUB_SHA::7}"
      - run: ./scripts/smoke-test.sh prod

  deploy-ovh:
    needs: deploy-prod
    continue-on-error: true
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Connexion au registre
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Déploiement sur le cluster du prof
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_OVH }}
        run: |
          export KUBECONFIG_FILE="$RUNNER_TEMP/ovh-kubeconfig.yaml"
          (umask 077; printf '%s' "$KUBECONFIG_CONTENT" > "$KUBECONFIG_FILE")
          trap 'rm -f "$KUBECONFIG_FILE"' EXIT
          ./scripts/deploy-ovh.sh "${GITHUB_SHA::7}"
