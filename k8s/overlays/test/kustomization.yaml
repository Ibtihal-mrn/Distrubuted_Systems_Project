apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base/
- ../../base/hpa
- ../../base/db-cluster
- ../../base/db-cluster-s1
- namespace.yaml
namespace: test
patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: test.photo.localhost
  target:
    kind: Ingress
    name: photo-service
images:
- name: photo-service
  newTag: v1
