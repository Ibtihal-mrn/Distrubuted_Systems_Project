apiVersion: v1
kind: Service 
metadata:
  name: db-s0
spec:
  selector:
    app: db-s0
  ports:
  - protocol: TCP
    port: 5432
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-s0
spec:
  serviceName: db-s0
  replicas: 1
  selector:
    matchLabels:
      app: db-s0
  template:
    metadata:
      labels:
        app: db-s0
    spec:
      containers:
      - name: db
        image: postgres:16
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-s0-credentials
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: photos
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "256Mi"
            cpu: "500m"
  volumeClaimTemplates:
  - metadata: 
      name: data
    spec: 
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 2Gi
         








