apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: 
  name: photos-s1
  labels: 
    component: database
spec: 
  instances: 2
  storage:
    size: 2Gi
  bootstrap:
    initdb:
      database: photos
      owner: photos
  resources: 
    requests: 
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"