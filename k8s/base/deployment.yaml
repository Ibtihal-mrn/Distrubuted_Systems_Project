apiVersion: apps/v1
kind: Deployment
metadata:
  name: photo-service
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  selector:
    matchLabels:
      app: photo-service
  template:
    metadata:
      labels:
        app: photo-service
    spec:
      containers:
      - name: photo-service
        image: photo-service:v1
        imagePullPolicy: IfNotPresent
        env:
        - name: SHARD0_DSN
          valueFrom:
            secretKeyRef:
              name: photos-s0-app   # Secret créé automatiquement par CloudNativePG
              key: uri              # clé qui contient postgresql://user:mdp@photos-s0-rw:5432/photos
        - name: SHARD1_DSN
          valueFrom:
            secretKeyRef:
              name: photos-s1-app
              key: uri
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        ports:
          - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "10"]
